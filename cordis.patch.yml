# dsh bundle layer: mount the dsh-vision-bridge wrapper plugin via the package
# root export. Since v0.2.5 the bridge runs with only `upstreamProvider`
# configured (Vision Auto-Discovery); `visionProvider` + `visionModel` are
# optional and must be configured both or neither. See README.md. The row
# `name` is the module specifier (scoped npm package identity since v0.2.4);
# the row `id` stays stable so existing profile config rows keep addressing
# it.
- insert:
    - id: dsh-vision-bridge
      name: '@liangdacheng/dsh-vision-bridge'
